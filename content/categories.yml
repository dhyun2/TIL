categories:
  web:
    label: HTML · 웹
    scope: HTML의 의미 구조와 접근성, 브라우저 동작, HTTP 요청·응답과 캐시 재사용 조건
  css:
    label: CSS
    scope: 스타일 규칙과 레이아웃 계산, 화면 크기에 따른 배치 변화
  javascript:
    label: JavaScript
    scope: 값과 함수, Promise, 이벤트 루프 등 JavaScript의 언어 동작과 실행 순서
  typescript:
    label: TypeScript
    scope: 타입 추론과 좁히기, 제네릭, 타입으로 상태나 제약을 표현하는 방법
  react:
    label: React
    scope: 컴포넌트의 상태와 렌더링, 훅의 생명주기, 프레임워크에서 React가 동작하는 방식
  testing:
    label: Testing
    scope: 무엇을 검증할지, 어떤 조건과 단언으로 테스트를 설계하고 자동화할지 다룬 기록
  tooling:
    label: Tooling
    scope: Git, 개발 환경, 빌드와 배포 도구의 설정 및 동작
  performance:
    label: Performance
    scope: 성능 지표의 의미, 병목의 원인, 최적화가 시간이나 자원 사용에 미치는 영향
  ai:
    label: AI
    scope: >-
      모델 학습과 추론, 프롬프트 설계, 임베딩과 검색 증강 생성(RAG), 모델 응답 평가.
      AI 에이전트의 설계와 활용, 도구 호출과 MCP 연동, 실행 계획, 컨텍스트와 메모리 관리,
      여러 에이전트의 협업과 실행 결과 평가
  backend:
    label: 백엔드
    scope: 서버의 요청 처리와 API 설계, 인증과 권한 검사, 데이터 모델링과 쿼리, 트랜잭션과 비동기 작업 처리
  infra:
    label: 인프라
    scope: 클라우드 자원 구성, 네트워크와 로드 밸런싱, 컨테이너 배포와 운영, 인프라 코드화(IaC), 모니터링과 장애 복구
